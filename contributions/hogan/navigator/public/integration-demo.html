<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soraine scene connection test</title><style>body{margin:0;background:#090e17;color:#c9e1ef;font:14px system-ui}header{display:flex;align-items:center;gap:16px;padding:16px}button{background:#a6dce9;color:#172838;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}iframe{width:100%;height:calc(100vh - 70px);border:0}output{margin-left:auto}</style></head><body><header><strong>Scene connection test</strong><button data-scene="moon">Inspect Moon Ultem</button><button data-scene="mars">Inspect Mars Ultem</button><output id="status">Connecting…</output></header><iframe id="research" src="./" title="Soraine research navigator"></iframe><script type="module">
const frame=document.querySelector('#research');
const status=document.querySelector('#status');
document.querySelectorAll('[data-scene]').forEach(button=>button.addEventListener('click',()=>frame.contentWindow.postMessage({type:'soraine:inspect',selection:{objectId:'sample-ultem',sceneId:button.dataset.scene,atmosphereId:'illustrative-enriched',cabinOverrides:{oxygen_percent:30,pressure_kpa_absolute:70.3}}},location.origin)));
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin)return;if(event.data.type==='soraine:ready')status.value='Ready';if(event.data.type==='soraine:return-to-scene'){status.value=`Returned to ${event.data.selection.sceneId} · ${event.data.selection.cabinOverrides?.oxygen_percent}% cabin oxygen`;window.lastReturnedSelection=event.data.selection;}});
</script></body></html>
