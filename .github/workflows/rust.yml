name: Rust

# Builds and tests the Rust port (dashboard/rust), including the WebAssembly
# target, on every push to the rust-rewrite branch.
on:
  pull_request:
    paths: ['dashboard/rust/**', 'dashboard/dist/**', '.github/workflows/rust.yml']
  push:
    branches: [rust-rewrite]
    paths:
      - 'dashboard/rust/**'
      - 'dashboard/dist/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard/rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust with the WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dashboard/rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('dashboard/rust/Cargo.lock') }}
      - name: Reference outputs match the current JavaScript
        run: |
          node tools/make-golden.mjs
          git diff --exit-code -- soraine-core/tests/golden.json
      - name: Tests
        run: cargo test --workspace
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust server passes the existing HTTP test
        run: cargo build -p soraine-server && node --test tools/check-server.mjs
      - name: WebAssembly build
        run: cargo build -p soraine-web --target wasm32-unknown-unknown --release
      - name: Package browser bindings
        run: |
          curl --fail --location --retry 3 https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz -o /tmp/wasm-bindgen.tar.gz
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          /tmp/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/soraine_web.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: soraine-browser-wasm
          path: dashboard/rust/pkg/
