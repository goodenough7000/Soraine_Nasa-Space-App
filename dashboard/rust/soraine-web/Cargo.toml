[package]
name = "soraine-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Browser (WebAssembly) entry point for Soraine. Exposes soraine-core to the page."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soraine-core = { path = "../soraine-core" }
serde_json = "1"
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
  "Blob", "BlobPropertyBag", "Document", "DomRect", "DomStringMap", "DomTokenList", "Element", "Event", "EventTarget", "History", "HtmlAnchorElement",
  "HtmlButtonElement", "HtmlCollection", "HtmlDialogElement", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "KeyboardEvent",
  "Location", "MouseEvent", "Node", "NodeList", "Response", "Url", "Window", "console",
]
